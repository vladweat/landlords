services:
  nginx:
    ports: !override
      - "127.0.0.1:8080:80"

  caddy:
    image: caddy:2
    network_mode: host
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
