services:
  nginx:
    ports: !override []

  caddy:
    image: caddy:2
    network_mode: !reset null
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped
    networks:
      app-network:
        ipv4_address: 172.18.0.10

volumes:
  caddy_data:
  caddy_config:
