# Изолированные PostgreSQL и Redis для локального/облачного прогона тестов.
# Запуск: docker compose -f docker-compose.test.yml up -d --wait
# Остановка и удаление временных данных: docker compose -f docker-compose.test.yml down
# PostgreSQL доступен тестовому процессу через 127.0.0.1:5433, Redis — через 127.0.0.1:6380.

name: landlords-test

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-landlords-test-only}
      POSTGRES_DB: landlords_db
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d landlords_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${TEST_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
