# Локальная разработка: порты БД/API на хост, hot-reload кода.
services:
  api:
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/worker.py:/app/worker.py:ro
      - ./backend/alembic:/app/alembic
      - ./backend/tests:/app/tests:ro
      - ./storage/documents:/app/storage/documents
      - ./storage/status:/app/storage/status
      - ./backend/fonts:/app/fonts:ro
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DEBUG=true
      - LOG_LEVEL=DEBUG

  celery-worker:
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/worker.py:/app/worker.py:ro
      - ./storage/documents:/app/storage/documents
      - ./storage/status:/app/storage/status
    command: python -m celery -A worker.celery_app worker --loglevel=debug --concurrency=2
    environment:
      - DEBUG=true
      - LOG_LEVEL=DEBUG

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"
