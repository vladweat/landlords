upstream api {
    server api:8000;
}

# Only Caddy can set the address nginx uses for per-client limits.
set_real_ip_from 172.18.0.10;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Independent per-client request budgets for sensitive public actions.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=registration_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=invite_accept_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=public_claim_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=reminder_zone:10m rate=10r/m;

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20m;

    limit_req_status 429;
    error_page 429 = @rate_limited;

    location @rate_limited {
        access_log off;
        default_type application/json;
        return 429 '{"status":"error","message":"Too many requests"}';
    }

    # Security headers (без HSTS на голом HTTP — TLS в docs/deploy.md)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Sensitive endpoints rate limiting (apply before generic /api/ proxy).
    # rewrite снимает префикс /api — FastAPI слушает /v1/...
    location = /api/v1/auth/login {
        limit_req zone=auth_zone burst=5 nodelay;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /api/v1/auth/forgot-password {
        limit_req zone=auth_zone burst=5 nodelay;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /api/v1/auth/reset-password {
        limit_req zone=auth_zone burst=5 nodelay;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /api/v1/auth/register {
        limit_req zone=registration_zone burst=2 nodelay;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /api/v1/reminders {
        limit_req zone=reminder_zone burst=5 nodelay;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Ограниченные public actions используют отдельные regex locations.
    # Во всех URL этой группы могут быть capability tokens — access log выключен.
    location ~ ^/api/v1/public/invites/[^/]+/accept$ {
        access_log off;
        limit_req_log_level info;
        limit_req zone=invite_accept_zone burst=2 nodelay;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location ~ ^/api/v1/public/(invoices|portal)/[^/]+/claim$ {
        access_log off;
        limit_req_log_level info;
        limit_req zone=public_claim_zone burst=3 nodelay;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Other public capability routes are intentionally not rate limited here,
    # but their token-bearing paths must remain absent from access logs.
    location /api/v1/public/ {
        access_log off;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /health {
        proxy_pass http://api/health;
    }

    location = /ready {
        proxy_pass http://api/ready;
    }

    # Юридические страницы без .html в URL (landing footer).
    location = /privacy { rewrite ^ /privacy.html last; }
    location = /terms { rewrite ^ /terms.html last; }
    location = /offer { rewrite ^ /offer.html last; }

    # SPA-ссылки приглашений, счетов, портала и сброса пароля могут содержать token.
    location ^~ /i/ {
        access_log off;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
    location ^~ /t/ {
        access_log off;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
    location = /invite {
        access_log off;
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
    location = /reset-password {
        access_log off;
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # SPA (Vite dist). Dev-фронт на :3000 проксирует /api сюда — CORS не нужен.
    # /status — React-роут (index.html), не статический файл.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
