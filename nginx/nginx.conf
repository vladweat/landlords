upstream api {
    server api:8000;
}

# Rate limiting zone for auth/reminder endpoints
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20m;

    # Security headers (без HSTS на голом HTTP — TLS в docs/deploy.md)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Sensitive endpoints rate limiting (apply before generic /api/ proxy).
    # rewrite снимает префикс /api — FastAPI слушает /v1/...
    location = /api/v1/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/v1/auth/forgot-password {
        limit_req zone=login_zone burst=5 nodelay;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/v1/auth/reset-password {
        limit_req zone=login_zone burst=5 nodelay;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/v1/reminders {
        limit_req zone=login_zone burst=10 nodelay;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # В URL публичных routes находятся capability tokens: не писать их в access log.
    location ^~ /api/v1/public/ {
        access_log off;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        proxy_pass http://api/health;
    }

    location = /ready {
        proxy_pass http://api/ready;
    }

    # Юридические страницы без .html в URL (landing footer).
    location = /privacy { rewrite ^ /privacy.html last; }
    location = /terms { rewrite ^ /terms.html last; }
    location = /offer { rewrite ^ /offer.html last; }

    # SPA-ссылки приглашений, счетов, портала и сброса пароля могут содержать token.
    location ^~ /i/ {
        access_log off;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
    location ^~ /t/ {
        access_log off;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
    location = /invite {
        access_log off;
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
    location = /reset-password {
        access_log off;
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # SPA (Vite dist). Dev-фронт на :3000 проксирует /api сюда — CORS не нужен.
    # /status — React-роут (index.html), не статический файл.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
