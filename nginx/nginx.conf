upstream api {
    server api:8000;
}

# Rate limiting zone for auth/reminder endpoints
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20m;

    # CORS для фронта (по умолчанию — локальный dev-фронтенд)
    add_header Access-Control-Allow-Origin "http://localhost:3000";
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
    add_header Access-Control-Allow-Headers "Authorization, Content-Type";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header Referrer-Policy "no-referrer-when-downgrade";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";

    # Preflight
    if ($request_method = OPTIONS) {
        return 204;
    }

    # Sensitive endpoints rate limiting (apply before generic /api/ proxy)
    location = /api/v1/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/v1/auth/forgot-password {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/api/v1/reminders {
        limit_req zone=login_zone burst=10 nodelay;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Документы больше НЕ отдаются напрямую nginx — проксируем запросы к API,
    # чтобы API мог проверить авторизацию / права доступа и отдать файл.
    # (Frontend должен использовать /api/v1/documents/{doc_id})
    # Старый статический алиас удалён.

    # Healthcheck
    location /health {
        proxy_pass http://api/health;
    }
}

