services:

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./storage/documents:/storage/documents:ro
    depends_on:
      - api
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # ports:
    #   - "8000:8000"
    env_file:
      - backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m celery -A worker.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./storage/documents:/app/storage/documents
    env_file:
      - backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    # healthcheck:
    #   disable: true
    healthcheck:
      disable: false
      test: ["CMD-SHELL", "python -c \"from celery import Celery; from app.core.config import settings; app = Celery(broker=settings.REDIS_URL); app.connection().connect(); print('OK')\""]
      interval: 30s
      timeout: 10s
      retries: 3

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m celery -A worker.celery_app beat --loglevel=info
    env_file:
      - backend/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      disable: true

  flower:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m celery -A worker.celery_app flower --port=5555
    env_file:
      - backend/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      disable: true
    # Flower — включается только в development профиле, не открываем порт в проде.
    profiles:
      - development

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: landlords_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - production



volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge