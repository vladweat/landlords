services:

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/ready"]
      interval: 30s
      timeout: 3s
      retries: 3

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_MODE: ${INSTALL_MODE:-offline}
    volumes:
      - ./storage/documents:/app/storage/documents
      - ./storage/status:/app/storage/status
    env_file:
      - backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      RUN_MIGRATIONS: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_MODE: ${INSTALL_MODE:-offline}
    command: python -m celery -A worker.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./storage/documents:/app/storage/documents
      - ./storage/status:/app/storage/status
    env_file:
      - backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from celery import Celery; from app.core.config import settings; app = Celery(broker=settings.REDIS_URL); app.connection().connect(); print('OK')\""]
      interval: 30s
      timeout: 10s
      retries: 3

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_MODE: ${INSTALL_MODE:-offline}
    command: python -m celery -A worker.celery_app beat --loglevel=info
    env_file:
      - backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      disable: true

  flower:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_MODE: ${INSTALL_MODE:-offline}
    command: python -m celery -A worker.celery_app flower --port=5555
    env_file:
      - backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      disable: true
    profiles:
      - development

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-landlords_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
