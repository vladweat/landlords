services:

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/ready"]
      interval: 30s
      timeout: 3s
      retries: 3

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_MODE: ${INSTALL_MODE:-offline}
    volumes:
      - ./storage/documents:/app/storage/documents
      - ./storage/status:/app/storage/status
    env_file:
      - backend/.env
    environment:
      DB_HOST: postgres
      MIGRATION_DB_USER: ""
      MIGRATION_DB_PASSWORD: ""
      REDIS_HOST: redis
      REDIS_USERNAME: landlords_api
      REDIS_PASSWORD_FILE: /run/secrets/redis_api_password
    secrets:
      - redis_api_password
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  db-role-bootstrap:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_MODE: ${INSTALL_MODE:-offline}
    command: ["python", "-m", "app.scripts.provision_runtime_db_role"]
    env_file:
      - backend/.env
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-landlords_db}
      MIGRATION_DB_HOST: postgres
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - app-network

  db-migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_MODE: ${INSTALL_MODE:-offline}
    command: ["true"]
    env_file:
      - backend/.env
    environment:
      DB_HOST: postgres
      MIGRATION_DB_HOST: postgres
      APP_ENV: production
      RUN_MIGRATIONS: "1"
    depends_on:
      db-role-bootstrap:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - app-network

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_MODE: ${INSTALL_MODE:-offline}
    command: python -m celery -A worker.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./storage/documents:/app/storage/documents
      - ./storage/status:/app/storage/status
    env_file:
      - backend/.env
    environment:
      DB_HOST: postgres
      MIGRATION_DB_USER: ""
      MIGRATION_DB_PASSWORD: ""
      REDIS_HOST: redis
      REDIS_USERNAME: landlords_worker
      REDIS_PASSWORD_FILE: /run/secrets/redis_worker_password
    secrets:
      - redis_worker_password
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from celery import Celery; from app.core.config import settings; app = Celery(broker=settings.REDIS_URL); app.connection().connect(); print('OK')\""]
      interval: 30s
      timeout: 10s
      retries: 3

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_MODE: ${INSTALL_MODE:-offline}
    command: python -m celery -A worker.celery_app beat --loglevel=info
    env_file:
      - backend/.env
    environment:
      DB_HOST: postgres
      MIGRATION_DB_USER: ""
      MIGRATION_DB_PASSWORD: ""
      REDIS_HOST: redis
      REDIS_USERNAME: landlords_worker
      REDIS_PASSWORD_FILE: /run/secrets/redis_worker_password
    secrets:
      - redis_worker_password
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      disable: true

  outbox-relay:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_MODE: ${INSTALL_MODE:-offline}
    command: python -m app.outbox_relay
    env_file:
      - backend/.env
    environment:
      DB_HOST: postgres
      MIGRATION_DB_USER: ""
      MIGRATION_DB_PASSWORD: ""
      REDIS_HOST: redis
      REDIS_USERNAME: landlords_worker
      REDIS_PASSWORD_FILE: /run/secrets/redis_worker_password
    secrets:
      - redis_worker_password
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      disable: true

  flower:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_MODE: ${INSTALL_MODE:-offline}
    command: python -m celery -A worker.celery_app flower --port=5555
    env_file:
      - backend/.env
    environment:
      DB_HOST: postgres
      MIGRATION_DB_USER: ""
      MIGRATION_DB_PASSWORD: ""
      REDIS_HOST: redis
      REDIS_USERNAME: landlords_flower
      REDIS_PASSWORD_FILE: /run/secrets/redis_flower_password
    secrets:
      - redis_flower_password
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      disable: true
    profiles:
      - development

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${MIGRATION_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${MIGRATION_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-landlords_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MIGRATION_DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:7
    command: ["redis-server", "--aclfile", "/run/secrets/redis_users_acl", "--appendonly", "yes"]
    secrets:
      - source: redis_acl_file
        target: redis_users_acl
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --user landlords_health --no-auth-warning -a '' ping | grep -qx PONG
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
          ip_range: 172.18.128.0/17

secrets:
  redis_acl_file:
    file: ${REDIS_ACL_FILE:-./secrets/redis/users.acl}
  redis_api_password:
    file: ${REDIS_API_PASSWORD_FILE:-./secrets/redis/api.password}
  redis_worker_password:
    file: ${REDIS_WORKER_PASSWORD_FILE:-./secrets/redis/worker.password}
  redis_flower_password:
    file: ${REDIS_FLOWER_PASSWORD_FILE:-./secrets/redis/flower.password}
