services:

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/ready"]
      interval: 30s
      timeout: 3s
      retries: 3

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_MODE: ${INSTALL_MODE:-offline}
    volumes:
      - ./storage/documents:/app/storage/documents
      - ./storage/status:/app/storage/status
    env_file:
      - backend/.env
    environment:
      DB_HOST: postgres
      MIGRATION_DB_USER: ""
      MIGRATION_DB_PASSWORD: ""
      REDIS_HOST: redis
      REDIS_USERNAME: landlords_api
      REDIS_PASSWORD_FILE: /run/secrets/redis_api_password
    secrets:
      - redis_api_password
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  db-role-bootstrap:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_MODE: ${INSTALL_MODE:-offline}
    command: ["python", "-m", "app.scripts.provision_runtime_db_role"]
    env_file:
      - backend/.env
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-landlords_db}
      MIGRATION_DB_HOST: postgres
      POSTGRES_EXPORTER_USER: ${POSTGRES_EXPORTER_USER:-landlords_metrics}
      POSTGRES_EXPORTER_PASSWORD_FILE: /run/secrets/postgres_exporter_password
      APP_ENV: development
    secrets:
      - postgres_exporter_password
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - app-network

  db-migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_MODE: ${INSTALL_MODE:-offline}
    command: ["true"]
    env_file:
      - backend/.env
    environment:
      DB_HOST: postgres
      MIGRATION_DB_HOST: postgres
      APP_ENV: production
      RUN_MIGRATIONS: "1"
    depends_on:
      db-role-bootstrap:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - app-network

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_MODE: ${INSTALL_MODE:-offline}
    command: python -m celery -A worker.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./storage/documents:/app/storage/documents
      - ./storage/status:/app/storage/status
    env_file:
      - backend/.env
    environment:
      DB_HOST: postgres
      MIGRATION_DB_USER: ""
      MIGRATION_DB_PASSWORD: ""
      REDIS_HOST: redis
      REDIS_USERNAME: landlords_worker
      REDIS_PASSWORD_FILE: /run/secrets/redis_worker_password
    secrets:
      - redis_worker_password
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "python -m celery -A worker.celery_app inspect ping --timeout=5 | grep -qi pong"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_MODE: ${INSTALL_MODE:-offline}
    command: python -m celery -A worker.celery_app beat --loglevel=info
    env_file:
      - backend/.env
    environment:
      DB_HOST: postgres
      MIGRATION_DB_USER: ""
      MIGRATION_DB_PASSWORD: ""
      REDIS_HOST: redis
      REDIS_USERNAME: landlords_worker
      REDIS_PASSWORD_FILE: /run/secrets/redis_worker_password
    secrets:
      - redis_worker_password
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-m", "app.scripts.check_celery_beat_health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  outbox-relay:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_MODE: ${INSTALL_MODE:-offline}
    command: python -m app.outbox_relay
    env_file:
      - backend/.env
    environment:
      DB_HOST: postgres
      MIGRATION_DB_USER: ""
      MIGRATION_DB_PASSWORD: ""
      REDIS_HOST: redis
      REDIS_USERNAME: landlords_worker
      REDIS_PASSWORD_FILE: /run/secrets/redis_worker_password
    secrets:
      - redis_worker_password
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-m", "app.scripts.check_outbox_relay_health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  flower:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_MODE: ${INSTALL_MODE:-offline}
    command: python -m celery -A worker.celery_app flower --port=5555
    env_file:
      - backend/.env
    environment:
      DB_HOST: postgres
      MIGRATION_DB_USER: ""
      MIGRATION_DB_PASSWORD: ""
      REDIS_HOST: redis
      REDIS_USERNAME: landlords_flower
      REDIS_PASSWORD_FILE: /run/secrets/redis_flower_password
    secrets:
      - redis_flower_password
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      disable: true
    profiles:
      - development

  prometheus:
    image: prom/prometheus:v3.13.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=4GB
      - --web.enable-lifecycle
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
      - node-exporter
      - postgres-exporter
      - redis-exporter
    restart: unless-stopped
    networks:
      - app-network

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    secrets:
      - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - app-network

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./deploy/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped
    networks:
      - app-network

  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)(/|$)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    restart: unless-stopped
    networks:
      - app-network

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: postgres:5432/${DB_NAME:-landlords_db}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_EXPORTER_USER:-landlords_metrics}
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres_exporter_password
    secrets:
      - postgres_exporter_password
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  redis-exporter:
    image: quay.io/oliver006/redis_exporter:v1.93.0-alpine
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_USER: landlords_exporter
      REDIS_PASSWORD_FILE: /run/secrets/redis_exporter_password
    secrets:
      - redis_exporter_password
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${MIGRATION_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${MIGRATION_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-landlords_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MIGRATION_DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:7
    command: ["redis-server", "--aclfile", "/run/secrets/redis_users_acl", "--appendonly", "yes"]
    secrets:
      - source: redis_acl_file
        target: redis_users_acl
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --user landlords_health --no-auth-warning -a '' ping | grep -qx PONG
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
          ip_range: 172.18.128.0/17

secrets:
  redis_acl_file:
    file: ${REDIS_ACL_FILE:-./secrets/redis/users.acl}
  redis_api_password:
    file: ${REDIS_API_PASSWORD_FILE:-./secrets/redis/api.password}
  redis_worker_password:
    file: ${REDIS_WORKER_PASSWORD_FILE:-./secrets/redis/worker.password}
  redis_flower_password:
    file: ${REDIS_FLOWER_PASSWORD_FILE:-./secrets/redis/flower.password}
  redis_exporter_password:
    file: ${REDIS_EXPORTER_PASSWORD_FILE:-./secrets/redis/exporter-passwords.json}
  postgres_exporter_password:
    file: ${POSTGRES_EXPORTER_PASSWORD_FILE:-./secrets/postgres/exporter.password}
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:-./secrets/monitoring/grafana_admin.password}
